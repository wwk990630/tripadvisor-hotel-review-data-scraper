[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tripadvisor-hotel-review-data-scraper"
version = "0.1.0"
description = "Offline-tested TripAdvisor hotel review scraper core"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WenKang", email = "wwk990630@gmail.com" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
